<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MorseMate - Login</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>📡 MorseMate</h1>
                <p>Learn Morse Code the Fun Way</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        placeholder="Enter your username"
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >
                </div>

                <div class="form-group">
                    <button type="submit" class="btn-primary" id="loginBtn">
                        <span class="btn-text">Sign In</span>
                        <span class="btn-loader" style="display: none;">
                            <span class="spinner"></span> Signing in...
                        </span>
                    </button>
                </div>

                <div id="errorMessage" class="error-message" style="display: none;"></div>
                <div id="successMessage" class="success-message" style="display: none;"></div>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="/auth/register">Sign up</a></p>
            </div>

            <div class="demo-accounts">
                <p class="demo-title">Demo Accounts:</p>
                <div class="demo-list">
                    <button class="demo-btn" onclick="fillDemoCredentials('admin', 'admin123')">
                        👑 Admin
                    </button>
                    <button class="demo-btn" onclick="fillDemoCredentials('premium', 'premium123')">
                        ⭐ Premium
                    </button>
                    <button class="demo-btn" onclick="fillDemoCredentials('user', 'user123')">
                        👤 User
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/login.js"></script>
</body>
</html>
