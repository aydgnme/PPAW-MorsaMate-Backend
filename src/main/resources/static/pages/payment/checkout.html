<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Checkout - MorseMate</title>
    <link rel="stylesheet" href="/css/payment.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <!-- Simulation Notice -->
        <div class="simulation-notice">
            <h4>⚠️ Simulation Mode</h4>
            <p>This is a simulated payment. No real money will be charged. Use any amount for testing.</p>
        </div>

        <!-- Payment Form -->
        <div class="payment-form">
            <h2>Complete Your Payment</h2>

            <div id="payment-message"></div>

            <form id="payment-form">
                <!-- Amount -->
                <div class="form-group">
                    <label for="amount">Amount *</label>
                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        step="0.01"
                        min="0.50"
                        max="10000"
                        value="9.99"
                        required
                    >
                </div>

                <!-- Currency -->
                <div class="form-group">
                    <label for="currency">Currency *</label>
                    <select id="currency" name="currency" required>
                        <option value="USD" selected>USD - US Dollar</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="TRY">TRY - Turkish Lira</option>
                        <option value="GBP">GBP - British Pound</option>
                    </select>
                </div>

                <!-- Payment Method -->
                <div class="form-group">
                    <label>Payment Method *</label>
                    <div class="payment-methods">
                        <label class="payment-method-option selected">
                            <input type="radio" name="paymentMethod" value="credit_card" checked>
                            <div>💳 Credit Card</div>
                        </label>
                        <label class="payment-method-option">
                            <input type="radio" name="paymentMethod" value="debit_card">
                            <div>💳 Debit Card</div>
                        </label>
                        <label class="payment-method-option">
                            <input type="radio" name="paymentMethod" value="bank_transfer">
                            <div>🏦 Bank Transfer</div>
                        </label>
                        <label class="payment-method-option">
                            <input type="radio" name="paymentMethod" value="paypal">
                            <div>🅿️ PayPal</div>
                        </label>
                    </div>
                </div>

                <!-- Subscription ID (Optional) -->
                <div class="form-group">
                    <label for="subscriptionId">Subscription ID (Optional)</label>
                    <input
                        type="number"
                        id="subscriptionId"
                        name="subscriptionId"
                        placeholder="Leave empty for direct payment"
                    >
                </div>

                <!-- Simulate Failure -->
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="simulateFailure" name="simulateFailure">
                        Simulate payment failure (for testing)
                    </label>
                </div>

                <!-- Payment Summary -->
                <div class="payment-summary">
                    <h3>Payment Summary</h3>
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="subtotal">$9.99</span>
                    </div>
                    <div class="summary-row">
                        <span>Processing Fee:</span>
                        <span>$0.00</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span id="total">$9.99</span>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
                    Complete Payment
                </button>

                <p style="text-align: center; margin-top: 16px; color: #6b7280; font-size: 14px;">
                    Simulation mode: No real payment will be processed
                </p>
            </form>
        </div>

        <!-- Payment History Link -->
        <div style="text-align: center; margin-top: 24px;">
            <a href="/pages/payment/history.html" style="color: #3b82f6; text-decoration: none;">
                View Payment History →
            </a>
        </div>
    </div>

    <script src="/js/payment.js"></script>
    <script>
        // Payment form handler
        document.getElementById('payment-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.target;
            const submitBtn = document.getElementById('submit-btn');
            const messageDiv = document.getElementById('payment-message');

            // Get form data
            const formData = {
                amount: parseFloat(form.amount.value),
                currency: form.currency.value,
                paymentMethod: form.paymentMethod.value,
                subscriptionId: form.subscriptionId.value ? parseInt(form.subscriptionId.value) : null,
                simulateFailure: form.simulateFailure.checked
            };

            // Show loading
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';
            messageDiv.innerHTML = '';

            try {
                // Create payment
                const payment = await window.paymentClient.createPayment(formData);

                if (payment.status === 'COMPLETED') {
                    // Success
                    window.location.href = `/pages/payment/success.html?payment=${payment.id}`;
                } else {
                    // Failed
                    window.paymentUI.showError(`Payment failed: ${payment.status}`);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Complete Payment';
                }
            } catch (error) {
                console.error('Payment error:', error);
                window.paymentUI.showError('Payment failed. Please try again.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Complete Payment';
            }
        });

        // Payment method selection
        document.querySelectorAll('.payment-method-option').forEach(option => {
            option.addEventListener('click', () => {
                document.querySelectorAll('.payment-method-option').forEach(opt => {
                    opt.classList.remove('selected');
                });
                option.classList.add('selected');
                option.querySelector('input[type="radio"]').checked = true;
            });
        });

        // Update summary when amount changes
        document.getElementById('amount').addEventListener('input', (e) => {
            const amount = parseFloat(e.target.value) || 0;
            const currency = document.getElementById('currency').value;
            const formatted = window.paymentClient.formatAmount(amount, currency);
            document.getElementById('subtotal').textContent = formatted;
            document.getElementById('total').textContent = formatted;
        });

        // Update summary when currency changes
        document.getElementById('currency').addEventListener('change', (e) => {
            const amount = parseFloat(document.getElementById('amount').value) || 0;
            const currency = e.target.value;
            const formatted = window.paymentClient.formatAmount(amount, currency);
            document.getElementById('subtotal').textContent = formatted;
            document.getElementById('total').textContent = formatted;
        });
    </script>
</body>
</html>
