<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - MorseMate</title>
    <link rel="stylesheet" href="/css/payment.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <div class="payment-result success">
            <div class="icon">✓</div>
            <h1>Payment Successful!</h1>
            <p id="payment-details">Your payment has been processed successfully.</p>

            <div class="simulation-notice" style="max-width: 500px; margin: 0 auto 32px;">
                <h4>Simulation Mode</h4>
                <p>This was a simulated payment. No real money was charged.</p>
            </div>

            <div id="payment-info" style="max-width: 500px; margin: 0 auto 32px;"></div>

            <div style="display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;">
                <a href="/pages/payment/history.html" class="btn btn-primary">View Payment History</a>
                <a href="/pages/payment/checkout.html" class="btn btn-secondary">Make Another Payment</a>
            </div>
        </div>
    </div>

    <script src="/js/payment.js"></script>
    <script>
        // Get payment ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const paymentId = urlParams.get('payment');

        if (paymentId) {
            // Fetch payment details
            window.paymentClient.getPayment(paymentId)
                .then(payment => {
                    document.getElementById('payment-details').textContent =
                        `Payment of ${window.paymentClient.formatAmount(payment.amount, payment.currency)} was successfully processed.`;

                    document.getElementById('payment-info').innerHTML = `
                        <div class="payment-summary">
                            <h3>Payment Details</h3>
                            <div class="summary-row">
                                <span>Payment ID:</span>
                                <span>${payment.id}</span>
                            </div>
                            <div class="summary-row">
                                <span>Amount:</span>
                                <span>${window.paymentClient.formatAmount(payment.amount, payment.currency)}</span>
                            </div>
                            <div class="summary-row">
                                <span>Status:</span>
                                <span class="status-badge status-${payment.status.toLowerCase()}">${payment.status}</span>
                            </div>
                            <div class="summary-row">
                                <span>Date:</span>
                                <span>${window.paymentClient.formatDate(payment.transactionDate)}</span>
                            </div>
                            <div class="summary-row">
                                <span>Payment Method:</span>
                                <span>${payment.paymentMethod}</span>
                            </div>
                            ${payment.stripePaymentId ? `
                                <div class="summary-row">
                                    <span>Transaction ID:</span>
                                    <span>${payment.stripePaymentId}</span>
                                </div>
                            ` : ''}
                        </div>
                    `;
                })
                .catch(error => {
                    console.error('Failed to fetch payment:', error);
                });
        }

        // Auto-redirect after 10 seconds
        setTimeout(() => {
            if (confirm('Redirect to payment history?')) {
                window.location.href = '/pages/payment/history.html';
            }
        }, 10000);
    </script>
</body>
</html>
