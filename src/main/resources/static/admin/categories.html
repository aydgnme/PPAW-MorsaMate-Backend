<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories Management - MorseMate Admin</title>
    <link rel="stylesheet" href="/css/admin.css">
    <style>
        body {
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .admin-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: white;
            box-shadow: 2px 0 4px rgba(0,0,0,0.1);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        .sidebar-header h2 {
            color: #4F46E5;
            font-size: 20px;
            margin: 0;
        }

        .nav-menu {
            padding: 16px 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: #6B7280;
            text-decoration: none;
            transition: all 0.2s;
        }

        .nav-item:hover {
            background: #f3f4f6;
            color: #4F46E5;
        }

        .nav-item.active {
            background: #EEF2FF;
            color: #4F46E5;
            border-left: 3px solid #4F46E5;
        }

        /* Main Content */
        .main-content {
            margin-left: 250px;
            flex: 1;
            padding: 24px;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .content-header h1 {
            color: #1F2937;
            font-size: 28px;
            margin: 0;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #4F46E5;
            color: white;
        }

        .btn-primary:hover {
            background: #4338CA;
        }

        .btn-success {
            background: #10B981;
            color: white;
        }

        .btn-danger {
            background: #EF4444;
            color: white;
        }

        .btn-secondary {
            background: #6B7280;
            color: white;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        /* Table */
        .table-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f9fafb;
        }

        th {
            padding: 16px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            color: #6B7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 16px;
            border-top: 1px solid #e5e7eb;
            color: #1F2937;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-success {
            background: #D1FAE5;
            color: #059669;
        }

        .badge-danger {
            background: #FEE2E2;
            color: #DC2626;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            color: #1F2937;
            font-size: 20px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            color: #6B7280;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4F46E5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .modal-footer {
            padding: 20px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6B7280;
        }

        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #4F46E5;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .alert-success {
            background: #D1FAE5;
            color: #059669;
            border: 1px solid #A7F3D0;
        }

        .alert-error {
            background: #FEE2E2;
            color: #DC2626;
            border: 1px solid #FECACA;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: auto;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <img src="/img/appIco.png" alt="MorseMate Logo" style="width: 32px; height: 32px; object-fit: contain; border-radius: 6px;">
                    <h2 style="margin: 0;">MorseMate Admin</h2>
                </div>
            </div>
            <nav class="nav-menu">
                <a href="/admin/dashboard" class="nav-item">Dashboard</a>
                <a href="/admin/categories.html" class="nav-item active">Categories</a>
                <a href="/admin/lessons.html" class="nav-item">Lessons</a>
                <a href="/admin/login.html" class="nav-item" onclick="event.preventDefault(); logout();">Logout</a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="content-header">
                <h1>Categories Management</h1>
                <button class="btn btn-primary" onclick="openCreateModal()">+ New Category</button>
            </div>

            <div id="alertContainer"></div>

            <div class="table-container">
                <div id="loadingContainer" class="loading">
                    <div class="spinner"></div>
                    <p>Loading categories...</p>
                </div>
                <table id="categoriesTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Order</th>
                            <th>Lessons</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="categoriesTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Create/Edit Modal -->
    <div id="categoryModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Create Category</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="categoryForm">
                <div class="modal-body">
                    <input type="hidden" id="categoryId">

                    <div class="form-group">
                        <label for="name">Name *</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" rows="3"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="displayOrder">Display Order *</label>
                        <input type="number" id="displayOrder" name="displayOrder" required min="0" value="0">
                    </div>

                    <div class="form-group">
                        <label for="iconUrl">Icon URL</label>
                        <input type="text" id="iconUrl" name="iconUrl" placeholder="https://...">
                    </div>

                    <div class="form-group">
                        <label class="checkbox-wrapper">
                            <input type="checkbox" id="isActive" name="isActive" checked>
                            <span>Active</span>
                        </label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.origin;
        const token = localStorage.getItem('adminToken');

        // Check authentication
        if (!token) {
            window.location.href = '/admin/login.html';
        }

        // Load categories on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadCategories();
        });

        // Load all categories
        async function loadCategories() {
            try {
                const response = await fetch(`${API_BASE_URL}/v1/categories`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error('Failed to load categories');

                const categories = await response.json();
                displayCategories(categories);
            } catch (error) {
                console.error('Error loading categories:', error);
                showAlert('Failed to load categories', 'error');
            }
        }

        // Display categories in table
        function displayCategories(categories) {
            const tbody = document.getElementById('categoriesTableBody');
            tbody.innerHTML = '';

            if (categories.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px; color: #6B7280;">No categories found</td></tr>';
            } else {
                categories.forEach(category => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${category.id}</td>
                        <td><strong>${category.name}</strong></td>
                        <td>${category.description || '-'}</td>
                        <td>${category.displayOrder}</td>
                        <td>${category.lessonCount || 0}</td>
                        <td>
                            <span class="badge ${category.isActive ? 'badge-success' : 'badge-danger'}">
                                ${category.isActive ? 'Active' : 'Inactive'}
                            </span>
                        </td>
                        <td>
                            <button class="btn btn-primary btn-sm" onclick="openEditModal(${category.id})">Edit</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteCategory(${category.id}, '${category.name}')">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            }

            document.getElementById('loadingContainer').style.display = 'none';
            document.getElementById('categoriesTable').style.display = 'table';
        }

        // Open create modal
        function openCreateModal() {
            document.getElementById('modalTitle').textContent = 'Create Category';
            document.getElementById('categoryForm').reset();
            document.getElementById('categoryId').value = '';
            document.getElementById('isActive').checked = true;
            document.getElementById('categoryModal').classList.add('show');
        }

        // Open edit modal
        async function openEditModal(id) {
            try {
                const response = await fetch(`${API_BASE_URL}/v1/categories/${id}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error('Failed to load category');

                const category = await response.json();

                document.getElementById('modalTitle').textContent = 'Edit Category';
                document.getElementById('categoryId').value = category.id;
                document.getElementById('name').value = category.name;
                document.getElementById('description').value = category.description || '';
                document.getElementById('displayOrder').value = category.displayOrder;
                document.getElementById('iconUrl').value = category.iconUrl || '';
                document.getElementById('isActive').checked = category.isActive;

                document.getElementById('categoryModal').classList.add('show');
            } catch (error) {
                console.error('Error loading category:', error);
                showAlert('Failed to load category', 'error');
            }
        }

        // Close modal
        function closeModal() {
            document.getElementById('categoryModal').classList.remove('show');
        }

        // Handle form submit
        document.getElementById('categoryForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('categoryId').value;
            const data = {
                name: document.getElementById('name').value,
                description: document.getElementById('description').value,
                displayOrder: parseInt(document.getElementById('displayOrder').value),
                iconUrl: document.getElementById('iconUrl').value,
                isActive: document.getElementById('isActive').checked
            };

            try {
                const url = id ? `${API_BASE_URL}/v1/categories/${id}` : `${API_BASE_URL}/v1/categories`;
                const method = id ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'Failed to save category');
                }

                showAlert(`Category ${id ? 'updated' : 'created'} successfully`, 'success');
                closeModal();
                loadCategories();
            } catch (error) {
                console.error('Error saving category:', error);
                showAlert(error.message, 'error');
            }
        });

        // Delete category
        async function deleteCategory(id, name) {
            if (!confirm(`Are you sure you want to delete category "${name}"?\n\nNote: You cannot delete categories with associated lessons.`)) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/v1/categories/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'Failed to delete category');
                }

                showAlert('Category deleted successfully', 'success');
                loadCategories();
            } catch (error) {
                console.error('Error deleting category:', error);
                showAlert(error.message, 'error');
            }
        }

        // Show alert
        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.appendChild(alert);

            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        // Logout
        function logout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
            window.location.href = '/admin/login.html';
        }

        // Close modal on outside click
        document.getElementById('categoryModal').addEventListener('click', (e) => {
            if (e.target.id === 'categoryModal') {
                closeModal();
            }
        });
    </script>
</body>
</html>
