<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:fragment="title">MorseMate Administration</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <th:block layout:fragment="styles"></th:block>
</head>
<body>
<div class="admin-shell">
    <header th:replace="~{fragments/admin-header :: adminHeader(${activePage})}"></header>
    <div class="admin-body">
        <aside th:replace="~{fragments/admin-sidebar :: adminSidebar(${activePage})}"></aside>
        <main layout:fragment="content">
            <div class="content-card">
                <header>
                    <h3>Content coming soon</h3>
                </header>
                <p>This area will render the page-specific content.</p>
            </div>
        </main>
    </div>
</div>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
