<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title th:text="${entityName} + ' List'">Entity List</title>
</head>
<body>
<th:block th:fragment="content">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">
                        <i class="fas fa-list"></i> <span th:text="${entityName}">Entity</span> List
                    </h3>
                    <div class="card-tools">
                        <a th:href="@{'/admin/entity/' + ${entityName} + '/create'}" class="btn btn-success btn-sm">
                            <i class="fas fa-plus"></i> Add New <span th:text="${entityName}">Entity</span>
                        </a>
                    </div>
                </div>
                <div class="card-body">
                    <!-- Search and Filter -->
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <div class="input-group">
                                <input type="text" id="searchInput" class="form-control" placeholder="Search...">
                                <div class="input-group-append">
                                    <button class="btn btn-primary" type="button" onclick="performSearch()">
                                        <i class="fas fa-search"></i> Search
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6 text-right">
                            <span class="badge badge-info" style="font-size: 14px;">
                                Total: <span th:text="${entities.size()}">0</span> records
                            </span>
                        </div>
                    </div>

                    <!-- Entity Table -->
                    <div class="table-responsive">
                        <table class="table table-bordered table-striped table-hover">
                            <thead>
                                <tr>
                                    <th style="width: 50px;">ID</th>
                                    <th th:each="field : ${fields}" th:text="${field.displayName}">Field</th>
                                    <th style="width: 180px;">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${entities.isEmpty()}">
                                    <td th:colspan="${fields.size() + 2}" class="text-center text-muted">
                                        <i class="fas fa-inbox fa-3x mb-2"></i>
                                        <p>No records found.</p>
                                        <a th:href="@{'/admin/entity/' + ${entityName} + '/create'}" class="btn btn-primary">
                                            <i class="fas fa-plus"></i> Create First <span th:text="${entityName}">Entity</span>
                                        </a>
                                    </td>
                                </tr>
                                <tr th:each="entity : ${entities}">
                                    <td th:text="${entity.id}">1</td>
                                    <td th:each="field : ${fields}">
                                        <!-- Render field value based on type -->
                                        <span th:switch="${field.type}">
                                            <!-- Boolean -->
                                            <span th:case="'BOOLEAN'">
                                                <span th:if="${field.getValue(entity)}" class="badge badge-success">
                                                    <i class="fas fa-check"></i> Yes
                                                </span>
                                                <span th:unless="${field.getValue(entity)}" class="badge badge-danger">
                                                    <i class="fas fa-times"></i> No
                                                </span>
                                            </span>

                                            <!-- Enum -->
                                            <span th:case="'ENUM'">
                                                <span class="entity-badge" th:text="${field.getValue(entity)}">VALUE</span>
                                            </span>

                                            <!-- Date/Time -->
                                            <span th:case="'DATE'">
                                                <span th:text="${#temporals.format(field.getValue(entity), 'yyyy-MM-dd')}">2025-01-01</span>
                                            </span>
                                            <span th:case="'DATETIME'">
                                                <span th:text="${#temporals.format(field.getValue(entity), 'yyyy-MM-dd HH:mm')}">2025-01-01 12:00</span>
                                            </span>

                                            <!-- Relation (ManyToOne, OneToOne) -->
                                            <span th:case="'RELATION'">
                                                <span th:if="${field.getValue(entity) != null}" class="badge badge-info">
                                                    <i class="fas fa-link"></i> <span th:text="${field.getDisplayValue(entity)}">Related</span>
                                                </span>
                                                <span th:unless="${field.getValue(entity) != null}" class="text-muted">-</span>
                                            </span>

                                            <!-- Collection (OneToMany, ManyToMany) -->
                                            <span th:case="'COLLECTION'">
                                                <span class="badge badge-secondary">
                                                    <i class="fas fa-list"></i> <span th:text="${field.getValue(entity).size()}">0</span> items
                                                </span>
                                            </span>

                                            <!-- Long Text -->
                                            <span th:case="'TEXT'">
                                                <span th:text="${#strings.abbreviate(field.getValue(entity), 50)}">Long text...</span>
                                            </span>

                                            <!-- Default (String, Number, etc.) -->
                                            <span th:case="*">
                                                <span th:text="${field.getValue(entity)}">Value</span>
                                            </span>
                                        </span>
                                    </td>
                                    <td>
                                        <div class="btn-group">
                                            <a th:href="@{'/admin/entity/' + ${entityName} + '/' + ${entity.id}}"
                                               class="btn btn-sm btn-info" title="View Details">
                                                <i class="fas fa-eye"></i>
                                            </a>
                                            <a th:href="@{'/admin/entity/' + ${entityName} + '/' + ${entity.id} + '/edit'}"
                                               class="btn btn-sm btn-primary" title="Edit">
                                                <i class="fas fa-edit"></i>
                                            </a>
                                            <button type="button" class="btn btn-sm btn-danger"
                                                    th:onclick="'confirmDelete(' + ${entity.id} + ', \'' + ${entityName} + '\')'"
                                                    title="Delete">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination (if needed in future) -->
                    <div class="row mt-3">
                        <div class="col-sm-12 col-md-5">
                            <div class="dataTables_info">
                                Showing <span th:text="${entities.size()}">0</span> entries
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header bg-danger">
                    <h5 class="modal-title text-white"><i class="fas fa-exclamation-triangle"></i> Confirm Delete</h5>
                    <button type="button" class="close text-white" data-dismiss="modal">
                        <span>&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this record?</p>
                    <p class="text-danger"><strong>This action cannot be undone!</strong></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn">
                        <i class="fas fa-trash"></i> Delete
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function performSearch() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('tbody tr');

            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                if (text.includes(searchTerm)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        // Search on Enter key
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        function confirmDelete(id, entityName) {
            $('#deleteModal').modal('show');
            document.getElementById('confirmDeleteBtn').onclick = function() {
                deleteEntity(id, entityName);
            };
        }

        function deleteEntity(id, entityName) {
            fetch(`/admin/entity/${entityName}/${id}/delete`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    window.location.reload();
                } else {
                    alert('Failed to delete entity');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred while deleting');
            });
        }
    </script>
</th:block>
</body>
</html>
