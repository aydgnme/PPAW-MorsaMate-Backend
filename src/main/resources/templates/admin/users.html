<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title layout:fragment="title">MorseMate Administration | Users</title>
</head>
<body>
<main class="admin-content" layout:fragment="content">
    <div class="breadcrumbs">
                    <span>Home</span>
                    <span>›</span>
                    <span>Users</span>
                </div>

                <div class="page-header">
                    <div>
                        <h2>Users</h2>
                        <div class="meta"
                             th:text="'Showing page ' + (${currentPage} + 1) + ' of ' + (${totalPages} == 0 ? 1 : ${totalPages})">Page meta
                        </div>
                    </div>
                    <a class="primary-action" href="/v1/categories/admin/all">Export categories API</a>
                </div>

                <div th:if="${loadError}" class="flash error" th:text="${loadError}">
                    Unable to load user data.
                </div>

                <section class="content-card" th:if="${!#lists.isEmpty(users)}">
                    <header>
                        <h3>User changelist</h3>
                    </header>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>User</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Created</th>
                                <th>Last login</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.id}">1</td>
                                <td>
                                    <strong th:text="${user.username}">username</strong>
                                    <small th:text="${user.email}">user@email.com</small>
                                    <small th:if="${user.fullName}" th:text="${user.fullName}">John Doe</small>
                                </td>
                                <td th:text="${user.role != null ? user.role : 'USER'}">USER</td>
                                <td>
                                    <div style="display:flex;flex-direction:column;gap:6px;">
                                        <span class="status"
                                              th:classappend="${user.isActive} ? ' active' : ' inactive'"
                                              th:text="${user.isActive} ? 'Active' : 'Inactive'">Active</span>
                                        <span class="status"
                                              th:classappend="${user.emailVerified} ? ' active' : ' inactive'"
                                              th:text="${user.emailVerified} ? 'Email verified' : 'Email pending'">
                                            Email verified
                                        </span>
                                    </div>
                                </td>
                                <td th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'dd MMM yyyy HH:mm') : '—'}">01 Jan 2024</td>
                                <td th:text="${user.lastLogin != null ? #temporals.format(user.lastLogin, 'dd MMM yyyy HH:mm') : '—'}">01 Jan 2024</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </section>

                <div class="empty-state" th:if="${#lists.isEmpty(users) and loadError == null}">
                    <strong>No users found</strong>
                    <span>User accounts will appear here once registered.</span>
                </div>

                <div class="pagination" th:if="${totalPages > 1}">
                    <span th:if="${currentPage == 0}" class="disabled">«</span>
                    <a th:if="${currentPage > 0}"
                       th:href="@{'/admin/users'(page=${currentPage - 1}, size=${pageSize})}">«</a>

                    <span th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}">
                        <span th:if="${pageNum == currentPage}"
                              class="active"
                              th:text="${pageNum + 1}">1</span>
                        <a th:if="${pageNum != currentPage}"
                           th:href="@{'/admin/users'(page=${pageNum}, size=${pageSize})}"
                           th:text="${pageNum + 1}">1</a>
                    </span>

                    <span th:if="${currentPage == totalPages - 1}" class="disabled">»</span>
                    <a th:if="${currentPage < totalPages - 1}"
                       th:href="@{'/admin/users'(page=${currentPage + 1}, size=${pageSize})}">»</a>
                </div>
</main>
</body>
</html>
