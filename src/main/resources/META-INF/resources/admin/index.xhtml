<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>MorseMate - Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</h:head>
<h:body>
    <h:form>
        <p:growl id="messages" showDetail="true"/>

        <div style="padding: 20px;">
            <h1>MorseMate Admin Dashboard</h1>
            <p:divider/>

            <div style="display: flex; gap: 20px; flex-wrap: wrap; margin: 20px 0;">
                <!-- Statistics Cards -->
                <p:panel header="Categories" style="flex: 1; min-width: 200px;">
                    <h:outputText value="#{categoryMB.categories.size()}"
                                  style="font-size: 2em; font-weight: bold; color: #007bff;"/>
                    <p/>
                    <p:commandButton value="Manage"
                                     action="/admin/category-list?faces-redirect=true"
                                     icon="pi pi-folder"
                                     styleClass="ui-button-info"/>
                </p:panel>

                <p:panel header="Lessons" style="flex: 1; min-width: 200px;">
                    <h:outputText value="0"
                                  style="font-size: 2em; font-weight: bold; color: #28a745;"/>
                    <p/>
                    <p:button value="Manage"
                              icon="pi pi-book"
                              styleClass="ui-button-success"
                              disabled="true"/>
                </p:panel>

                <p:panel header="Users" style="flex: 1; min-width: 200px;">
                    <h:outputText value="0"
                                  style="font-size: 2em; font-weight: bold; color: #ffc107;"/>
                    <p/>
                    <p:button value="Manage"
                              icon="pi pi-users"
                              styleClass="ui-button-warning"
                              disabled="true"/>
                </p:panel>

                <p:panel header="System" style="flex: 1; min-width: 200px;">
                    <h:outputText value="Active"
                                  style="font-size: 2em; font-weight: bold; color: #17a2b8;"/>
                    <p/>
                    <p:button value="Settings"
                              icon="pi pi-cog"
                              styleClass="ui-button-secondary"
                              disabled="true"/>
                </p:panel>
            </div>

            <p:divider/>

            <h2>Quick Actions</h2>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <p:commandButton value="Manage Categories"
                                 action="/admin/category-list?faces-redirect=true"
                                 icon="pi pi-folder"
                                 styleClass="ui-button-raised"/>
                <p:button value="View API Docs"
                          href="/swagger-ui/index.html"
                          icon="pi pi-book"
                          styleClass="ui-button-raised ui-button-info"
                          target="_blank"/>
            </div>
        </div>
    </h:form>
</h:body>
</html>
