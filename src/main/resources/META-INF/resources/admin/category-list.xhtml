<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui"
                template="/admin.xhtml">

    <ui:define name="title">
        Category Management
    </ui:define>

    <ui:define name="description">
        Manage all categories
    </ui:define>

    <ui:define name="body">
        <h:form id="form">
            <p:growl id="growl" life="4000"/>

            <div class="box box-primary">
                <div class="box-header with-border">
                    <h3 class="box-title"><i class="fa fa-folder"></i> Category List</h3>
                    <div class="box-tools pull-right">
                        <p:commandButton value="New Category"
                                         icon="fa fa-plus"
                                         styleClass="btn-success"
                                         actionListener="#{categoryMB.clear}"
                                         oncomplete="PF('categoryDialog').show()"
                                         update=":form:categoryDetail"
                                         process="@this"/>
                    </div>
                </div>

                <div class="box-body">
                    <p:dataTable id="categoryTable"
                                 var="category"
                                 value="#{categoryMB.categories}"
                                 rows="10"
                                 paginator="true"
                                 paginatorPosition="bottom"
                                 emptyMessage="No categories found"
                                 rowKey="#{category.id}"
                                 selectionMode="single"
                                 selection="#{categoryMB.selectedCategory}"
                                 styleClass="table table-striped table-bordered">

                        <p:column headerText="ID" style="width: 50px;">
                            <h:outputText value="#{category.id}"/>
                        </p:column>

                        <p:column headerText="Name" sortBy="#{category.name}">
                            <h:outputText value="#{category.name}"/>
                        </p:column>

                        <p:column headerText="Description">
                            <h:outputText value="#{category.description}"/>
                        </p:column>

                        <p:column headerText="Order" style="width: 80px;">
                            <h:outputText value="#{category.displayOrder}"/>
                        </p:column>

                        <p:column headerText="Status" style="width: 100px;">
                            <h:outputText value="#{category.isActive ? 'Active' : 'Inactive'}"
                                          styleClass="label #{category.isActive ? 'label-success' : 'label-danger'}"/>
                        </p:column>

                        <p:column headerText="Lessons" style="width: 80px;">
                            <h:outputText value="#{category.lessonCount}"/>
                        </p:column>

                        <p:column headerText="Actions" style="width: 150px;">
                            <p:commandButton icon="fa fa-edit"
                                             styleClass="btn-primary btn-sm"
                                             actionListener="#{categoryMB.edit(category)}"
                                             oncomplete="PF('categoryDialog').show()"
                                             update=":form:categoryDetail"
                                             process="@this">
                                <f:setPropertyActionListener value="#{category}"
                                                             target="#{categoryMB.selectedCategory}"/>
                            </p:commandButton>

                            <p:commandButton icon="fa fa-trash"
                                             styleClass="btn-danger btn-sm"
                                             style="margin-left: 5px;"
                                             oncomplete="PF('deleteDialog').show()"
                                             update=":form:deleteConfirm"
                                             process="@this">
                                <f:setPropertyActionListener value="#{category}"
                                                             target="#{categoryMB.selectedCategory}"/>
                            </p:commandButton>
                        </p:column>
                    </p:dataTable>
                </div>
            </div>

            <!-- Create/Edit Dialog -->
            <p:dialog id="categoryDialog"
                      header="#{categoryMB.editing ? 'Edit' : 'Create'} Category"
                      widgetVar="categoryDialog"
                      modal="true"
                      width="600"
                      closable="true"
                      resizable="false">

                <p:outputPanel id="categoryDetail">
                    <div class="ui-fluid">
                        <div class="ui-g">
                            <div class="ui-g-12">
                                <p:outputLabel for="name" value="Name *"/>
                                <p:inputText id="name"
                                             value="#{categoryMB.category.name}"
                                             required="true"
                                             requiredMessage="Name is required"/>
                            </div>

                            <div class="ui-g-12">
                                <p:outputLabel for="description" value="Description"/>
                                <p:inputTextarea id="description"
                                                 value="#{categoryMB.category.description}"
                                                 rows="3"/>
                            </div>

                            <div class="ui-g-6">
                                <p:outputLabel for="displayOrder" value="Display Order *"/>
                                <p:inputNumber id="displayOrder"
                                               value="#{categoryMB.category.displayOrder}"
                                               decimalPlaces="0"
                                               required="true"/>
                            </div>

                            <div class="ui-g-6">
                                <p:outputLabel for="isActive" value="Active"/>
                                <br/>
                                <p:selectBooleanCheckbox id="isActive"
                                                         value="#{categoryMB.category.isActive}"/>
                            </div>

                            <div class="ui-g-12">
                                <p:outputLabel for="iconUrl" value="Icon URL"/>
                                <p:inputText id="iconUrl"
                                             value="#{categoryMB.category.iconUrl}"
                                             placeholder="https://example.com/icon.png"/>
                            </div>
                        </div>
                    </div>
                </p:outputPanel>

                <f:facet name="footer">
                    <p:commandButton value="Cancel"
                                     icon="fa fa-times"
                                     onclick="PF('categoryDialog').hide()"
                                     styleClass="btn-default"
                                     type="button"/>

                    <p:commandButton value="Save"
                                     icon="fa fa-save"
                                     actionListener="#{categoryMB.save}"
                                     oncomplete="if (!args.validationFailed) PF('categoryDialog').hide()"
                                     update=":form:categoryTable :form:growl"
                                     process=":form:categoryDetail"
                                     styleClass="btn-primary"/>
                </f:facet>
            </p:dialog>

            <!-- Delete Confirmation Dialog -->
            <p:confirmDialog id="deleteConfirm"
                             widgetVar="deleteDialog"
                             message="Are you sure you want to delete this category?"
                             header="Confirm Delete"
                             severity="alert"
                             width="400">

                <p:commandButton value="No"
                                 onclick="PF('deleteDialog').hide()"
                                 styleClass="btn-default"
                                 type="button"/>

                <p:commandButton value="Yes, Delete"
                                 icon="fa fa-trash"
                                 actionListener="#{categoryMB.delete}"
                                 oncomplete="PF('deleteDialog').hide()"
                                 update=":form:categoryTable :form:growl"
                                 process="@this"
                                 styleClass="btn-danger"/>
            </p:confirmDialog>
        </h:form>
    </ui:define>

</ui:composition>
