# Application Name
spring.application.name=MorseMate
app.version=1.0.0

# API Configuration
api.version=${API_VERSION:v1}

# Server Configuration
server.port=${SERVER_PORT:8080}

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway Configuration
# Temporarily disabled - will enable after schema is stable
spring.flyway.enabled=false
# spring.flyway.baseline-on-migrate=true
# spring.flyway.locations=classpath:db/migration
# spring.flyway.validate-on-migrate=true

# Logging Configuration
logging.level.root=INFO
logging.level.me.aydgn=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT Configuration
# IMPORTANT: Use a strong secret key (minimum 256 bits / 32 characters)
# For production: Set JWT_SECRET environment variable
# Default secret below is for DEVELOPMENT ONLY - DO NOT USE IN PRODUCTION
jwt.secret=${JWT_SECRET:MorseMate-Super-Secret-Key-For-Development-Only-Change-In-Production-2025}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jackson Configuration (JSON)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

spring.security.user.name=aydgn
spring.security.user.password=Aamert12

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.packages-to-scan=me.aydgn.MorseMate.controller
springdoc.show-actuator=false

# Application Configuration
app.name=MorseMate

# Redirect URLs for security flow
app.redirect-url=https://aydgn.me
app.admin-panel-url=/admin/index.xhtml

# JSF Configuration (JoinFaces)
joinfaces.faces.project-stage=Development
joinfaces.faces.facelets-refresh-period=0
joinfaces.faces.development=true
joinfaces.faces.validate-empty-fields=true

# JSF Servlet Configuration
joinfaces.faces-servlet.enabled=true
joinfaces.faces-servlet.url-mappings=*.xhtml

# PrimeFaces Configuration
joinfaces.primefaces.theme=admin
joinfaces.primefaces.font-awesome=true
joinfaces.primefaces.move-scripts-to-bottom=true

# AdminFaces Configuration
admin.skin=skin-blue
admin.auto-show-navbar=true
admin.auto-hide-messages=true
admin.messages-hide-timeout=2500
admin.date-format=MM/dd/yyyy HH:mm:ss
admin.template-path=/admin.xhtml
admin.index-page=/admin/index.xhtml
admin.login-page=/login.xhtml
admin.error-page=/error/500.xhtml
admin.breadcrumb-size=5
admin.enable-slide-menu=true
admin.enable-ripple=true
admin.ripple-mobile-only=true
admin.extension-less-urls=false
admin.render-messages=true
admin.render-ajax-status=true
admin.disable-filter=false
admin.ignore-security-constraints=.*\\.xhtml
admin.control-sidebar.show-on-mobile=false
admin.control-sidebar.left-menu-template=true
admin.control-sidebar.fixed-layout=false
admin.control-sidebar.boxed-layout=false
admin.control-sidebar.sidebar-collapsed=false
admin.control-sidebar.expand-on-hover=false
admin.control-sidebar.fixed-control-sidebar=false
admin.control-sidebar.skin-blue=true