name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build production JAR
      run: ./gradlew clean build -x test

    - name: Extract version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: build/libs/*.jar
        body: |
          ## MorseMate ${{ steps.get_version.outputs.VERSION }}

          ### What's Changed
          - See commit history for details

          ### Installation
          ```bash
          java -jar morsemate-${{ steps.get_version.outputs.VERSION }}.jar
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker image
      run: |
        docker build -t morsemate:${{ steps.get_version.outputs.VERSION }} .
        docker tag morsemate:${{ steps.get_version.outputs.VERSION }} morsemate:latest

    # Uncomment when you have Docker registry
    # - name: Push to Docker Hub
    #   run: |
    #     echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
    #     docker push morsemate:${{ steps.get_version.outputs.VERSION }}
    #     docker push morsemate:latest

    - name: Notify deployment
      if: success()
      run: |
        echo "✅ Deployment successful for version ${{ steps.get_version.outputs.VERSION }}"
        # Add notification to Slack/Discord here if needed
